<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABCL/c+ com04 Demo</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101010;
      color: #f4f4f4;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101010;
    }

    main {
      width: min(960px, calc(100vw - 32px));
    }

    h1 {
      margin: 0 0 16px;
      font-size: 24px;
      font-weight: 650;
    }

    video {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border: 1px solid #303030;
    }

    p {
      margin: 12px 0 0;
      color: #b8b8b8;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>ABCL/c+ com04 Demo</h1>
    <video controls autoplay muted loop playsinline>
      <source src="media/com04-demo.mp4" type="video/mp4">
    </video>
    <p>Generated from the com04.bat / LDD.abcl drawing sequence.</p>
  </main>
</body>
</html>
